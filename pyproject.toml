[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "scenenav-ai"
version = "0.1.0"
description = "Scene Aided Navigation Research Prototype — offline image matching and region estimation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
log_cli = true
log_cli_level = "INFO"

[tool.setuptools.packages.find]
where = ["backend"]
